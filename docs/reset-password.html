<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ตั้งรหัสผ่านใหม่ | NEXT SIP</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./auth.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-brand" href="./login.html">NEXT SIP <span>AI CRAFT LAB</span></a>
    <section class="auth-card">
      <div class="auth-kicker">ACCOUNT RECOVERY</div>
      <h1>ตั้งรหัสผ่านใหม่</h1>
      <p class="auth-subtitle">กรอกรหัสผ่านใหม่สำหรับบัญชีของคุณ</p>
      <form id="new-password-form">
        <label class="field"><span>รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</span><input id="new-password" type="password" minlength="8" autocomplete="new-password" required></label>
        <label class="field"><span>ยืนยันรหัสผ่านใหม่</span><input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required></label>
        <button class="auth-primary" type="submit">บันทึกรหัสผ่านใหม่</button>
      </form>
      <div id="reset-status" class="auth-status" role="status" aria-live="polite" hidden></div>
      <a class="auth-link" href="./login.html">กลับไปหน้าเข้าสู่ระบบ</a>
    </section>
  </main>
  <script type="module" src="./reset-password.js"></script>
</body>
</html>
